<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.panelbridge.Helper1"/>
  </policy>
  <policy context="default">
    <deny own="org.panelbridge.Helper1"/>
    <deny send_destination="org.panelbridge.Helper1"/>
    <allow send_destination="org.panelbridge.Helper1" send_interface="org.panelbridge.Helper1" send_member="Status"/>
    <allow send_destination="org.panelbridge.Helper1" send_interface="org.panelbridge.Helper1" send_member="Discover"/>
    <allow send_destination="org.panelbridge.Helper1" send_interface="org.panelbridge.Helper1" send_member="Connect"/>
    <allow send_destination="org.panelbridge.Helper1" send_interface="org.panelbridge.Helper1" send_member="KeepAlive"/>
    <allow send_destination="org.panelbridge.Helper1" send_interface="org.panelbridge.Helper1" send_member="Release"/>
  </policy>
</busconfig>
